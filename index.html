<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEASLab2D - Individual AI Agent Design (PEAS Framework)</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/blocks.css" />
  <link rel="stylesheet" href="styles/v6.css" />
  <link rel="stylesheet" href="styles/light.css" />

  <!-- Importmap for Local Three.js and Addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- 1. Full-Screen Interactive Apartment Viewport Layer -->
  <div class="fullscreen-house-container" id="fullscreenHouseContainer">
    <!-- 2D Canvas View (with 360° rotation) -->
    <canvas id="houseCanvas" tabindex="0"></canvas>

    <!-- 3D WebGL Three.js Canvas View (Apartment.glb) -->
    <canvas id="threeCanvas" tabindex="0"></canvas>

    <!-- 3D Model Loading Overlay -->
    <div id="glbLoadingOverlay" class="glb-loading-overlay">
      <div class="glb-loading-box">
        <span class="loading-icon">🏢</span>
        <div class="loading-text">Loading 3D Apartment Model (GLB)...</div>
        <div class="loading-progress-bar">
          <div class="loading-progress-fill" id="glbProgressFill" style="width: 15%;"></div>
        </div>
        <div class="loading-sub" id="glbProgressText">Initializing 360° Interactive Environment...</div>
        <button class="btn btn-sm btn-outline cancel-glb-btn" id="cancelGlbLoadBtn" style="margin-top: 14px; font-weight: 600;">
          ✕ Dismiss loading overlay
        </button>
      </div>
    </div>

    <!-- Map View Actions (Bottom Right) -->
    <div class="map-view-actions">
      <button class="btn-glass btn-highlight" id="focusRobotBtn" title="Instantly center camera on cleaning robot">
        🤖 Focus Robot
      </button>
      <button class="btn-glass" id="followRobotBtn" title="Lock camera to follow cleaning robot">
        🎥 Follow Robot
      </button>
      <button class="btn-glass" id="recenterMapBtn" title="Reset Camera to Center Apartment">
        ⛶ Center Map
      </button>
    </div>

    <!-- Floating Live Simulation HUD (Bottom Center, for observing & testing) -->
    <div id="simFloatingHud" class="sim-floating-hud" hidden>
      <div class="sim-hud-status">
        <span class="hud-status-dot running" id="hudStatusDot"></span>
        <span class="hud-status-text" id="hudStatusText">PAUSED</span>
        <span class="hud-tick-pill" id="hudTickText">Tick 0</span>
        <div class="hud-task-badge" id="hudTaskBadge" title="Current stage">
          <span id="hudTaskIcon">🧹</span>
          <span id="hudTaskName">Task 1 of 3 · Navigation &amp; common behaviors</span>
        </div>
      </div>

      <div class="sim-hud-controls">
        <button class="btn-hud-icon" id="hudPlayPauseBtn" title="Play/Pause Simulation">Run</button>
        <div class="hud-speed-group">
          <button class="hud-speed-btn active" data-speed="1">1x</button>
          <button class="hud-speed-btn" data-speed="2">2x</button>
          <button class="hud-speed-btn" data-speed="5">5x</button>
        </div>
        <button class="btn-hud-icon" id="hudResetBtn" title="Reset Simulation">↺</button>
      </div>

      <div id="hudCriteria" class="hud-criteria" aria-live="polite"></div>

      <!-- Quick Observation Controls -->
      <div class="sim-hud-stamps">
        <span class="hud-stamp-label">Stamp Observation:</span>
        <button class="hud-stamp-btn pass" id="hudStampPass" title="Mark Specification Match (✓)">✓</button>
        <button class="hud-stamp-btn fail" id="hudStampFail" title="Mark Specification Violation (✗)">✗</button>
        <button class="hud-stamp-btn query" id="hudStampQuery" title="Mark Uncertain / Needs Review (?)">?</button>
      </div>

      <button class="btn btn-sm btn-primary-glass" id="hudOpenLabBtn">
        Open Step 6 Lab ↗
      </button>
    </div>

    <!-- Robot POV Modal Overlay -->
    <div id="robotPovModal"></div>
  </div>

  <!-- 2. Floating Top Navigation Header -->
  <header class="app-header floating-header">
    <!-- Step Navigation Tracker Pills (Click to open that step in modal) -->
    <span id="stageProgress" class="stage-progress">Task 1 of 3 · Navigation &amp; common behaviors</span>


    <!-- Header Action Controls -->
    <div class="header-actions">
      <!-- 360° View Mode Dropdown / Button Group -->
      <div class="view-mode-group">
        <button class="btn-mode" id="viewMode3DBtn" title="Interactive 3D 360° Orbit (Apartment.glb)">
          🌐 3D 360°
        </button>
        <button class="btn-mode" id="viewModeFpsBtn" title="First-Person 360° Walkthrough">
          🚶 FPS 360°
        </button>

      </div>

      <!-- Robot POV Quick Button -->
      <button class="btn btn-sm btn-outline" id="quickPovBtn" title="Enter or exit the robot's first-person camera">
        👁️ POV
      </button>

      <!-- Audio Mute Toggle -->
      <button class="btn btn-sm btn-ghost" id="muteToggleBtn" title="Toggle sound effects">
        🔊 On
      </button>

    </div>
  </header>

  <div id="dashboardMenu" class="dashboard-menu">
    <div id="dashboardStepMenu" class="dashboard-step-menu">
      <strong class="workstation-menu-title">Workstation</strong>
      <button type="button" id="stepScrollLeft" class="step-scroll-button" aria-label="Scroll to first step" hidden>◀</button>
    <nav class="steps-nav-tracker" id="dashboardSteps" aria-label="Workstation steps">
      <button type="button" class="step-nav-item" data-step="0" aria-controls="stepModalOverlay">0. Overview</button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="1">
        1. Purpose (P)
      </button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="2">
        2. Environment (E)
      </button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="3">
        3. Sensors (S)
      </button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="4">
        4. Actuators (A)
      </button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="5">
        5. Decision Logic
      </button>
      <button type="button" aria-controls="stepModalOverlay" class="step-nav-item" data-step="6">
        6. Test & Debug
      </button>
    </nav>
      <button type="button" id="stepScrollRight" class="step-scroll-button" aria-label="Scroll to last step" hidden>▶</button>
    </div>

  </div>

  <section id="environmentSceneProgress" class="environment-scene-progress" aria-label="Environment observation progress" hidden>
    <div class="environment-scene-heading">
      <strong>Environment observations</strong>
      <span id="environmentSceneTotal" role="status" aria-live="polite"></span>
    </div>
    <div id="environmentSceneTools" hidden>
      <div class="environment-scene-actions" role="group" aria-label="Environment views">
        <button type="button" class="btn btn-outline" data-environment-view="fps" title="Walk around in FPS 360°">FPS 360°</button>
        <button type="button" class="btn btn-outline" data-environment-view="thirdPerson" title="View yourself in Third person">Third person</button>
        <button type="button" class="btn btn-outline" data-environment-view="whole" title="View whole apartment">Whole apartment</button>
      </div>
    </div>
    <div class="environment-scene-checklist"></div>
  </section>
  <button type="button" id="environmentSceneContinue" class="btn btn-primary" hidden>Observation done</button>

  <aside id="sensorAssemblyPreview" class="sensor-floating-preview" aria-label="Robot sensor preview" hidden></aside>

  <!-- 3. Step Selection & Workstation Popup Modal Dialog -->
  <div id="stepModalOverlay" class="step-modal-overlay" style="display: none;">
    <div class="step-modal-dialog">
      <!-- Modal Header with Quick Step Tabs and Close Button -->
      <div class="step-modal-header">
        <div class="modal-header-meta">
          <span class="modal-badge-step" id="modalStepBadge">STEP 1 OF 6</span>
          <h2 id="modalStepHeading">Set performance measurement</h2>
        </div>

        <button class="modal-close-btn" id="stepModalCloseBtn" title="Collapse Workstation (Esc)">
          ✕ Close workstation [Esc]
        </button>
      </div>

      <!-- Modal Body Content -->
      <div class="step-modal-body">
        <div id="stepsPanelMount"></div>
        <div id="blockCanvasMount" style="display: none;"></div>
      </div>
    </div>
  </div>

  <dialog id="logicBoardDialog" aria-label="Decision Logic canvas"></dialog>

  <div class="language-switch" role="group" aria-label="Interface language / 界面语言" data-i18n-skip>
    <button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">中文</button>
    <button type="button" data-language="en" lang="en" aria-pressed="true">English</button>
  </div>

  <!-- Main JavaScript Module Entry -->
  <script src="vendor/blockly/blockly_compressed.js"></script>
  <script src="vendor/blockly/en.js"></script>
  <script src="vendor/blockly/blocks_compressed.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
