<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PEASLab2D - Individual AI Agent Design (PEAS Framework)</title>
  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/blocks.css" />
  <link rel="stylesheet" href="styles/v6.css" />
  <link rel="stylesheet" href="styles/light.css" />

  <!-- Importmap for Local Three.js and Addons -->
  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <!-- 1. Full-Screen Interactive Apartment Viewport Layer -->
  <div class="fullscreen-house-container" id="fullscreenHouseContainer">
    <!-- 2D Canvas View (with 360° rotation) -->
    <canvas id="houseCanvas"></canvas>

    <!-- 3D WebGL Three.js Canvas View (Apartment.glb) -->
    <canvas id="threeCanvas"></canvas>

    <!-- 3D Model Loading Overlay -->
    <div id="glbLoadingOverlay" class="glb-loading-overlay">
      <div class="glb-loading-box">
        <span class="loading-icon">🏢</span>
        <div class="loading-text">Loading 3D Apartment Model (GLB)...</div>
        <div class="loading-progress-bar">
          <div class="loading-progress-fill" id="glbProgressFill" style="width: 15%;"></div>
        </div>
        <div class="loading-sub" id="glbProgressText">Initializing 360° Interactive Environment...</div>
        <button class="btn btn-sm btn-outline cancel-glb-btn" id="cancelGlbLoadBtn" style="margin-top: 14px; font-weight: 600;">
          ✕ Dismiss loading overlay
        </button>
      </div>
    </div>

    <!-- Map View Actions (Bottom Right) -->
    <div class="map-view-actions">
      <button class="btn-glass btn-highlight" id="focusRobotBtn" title="Instantly center camera on cleaning robot">
        🤖 Focus Robot
      </button>
      <button class="btn-glass" id="followRobotBtn" title="Lock camera to follow cleaning robot">
        🎥 Follow Robot
      </button>
      <button class="btn-glass" id="recenterMapBtn" title="Reset Camera to Center Apartment">
        ⛶ Center Map
      </button>
    </div>

    <!-- Floating Live Simulation HUD (Bottom Center, for observing & testing) -->
    <div id="simFloatingHud" class="sim-floating-hud" hidden>
      <div class="sim-hud-status">
        <span class="hud-status-dot running" id="hudStatusDot"></span>
        <span class="hud-status-text" id="hudStatusText">PAUSED</span>
        <span class="hud-tick-pill" id="hudTickText">Tick 0</span>
        <div class="hud-task-badge" id="hudTaskBadge" title="Current stage">
          <span id="hudTaskIcon">🧹</span>
          <span id="hudTaskName">Stage 1 · Vacuum the floor</span>
        </div>
      </div>

      <div class="sim-hud-controls">
        <button class="btn-hud-icon" id="hudPlayPauseBtn" title="Play/Pause Simulation">Run</button>
        <div class="hud-speed-group">
          <button class="hud-speed-btn active" data-speed="1">1x</button>
          <button class="hud-speed-btn" data-speed="2">2x</button>
          <button class="hud-speed-btn" data-speed="5">5x</button>
        </div>
        <button class="btn-hud-icon" id="hudResetBtn" title="Reset Simulation">↺</button>
      </div>

      <div id="hudCriteria" class="hud-criteria" aria-live="polite"></div>

      <!-- Quick Observation Controls -->
      <div class="sim-hud-stamps">
        <span class="hud-stamp-label">Stamp Observation:</span>
        <button class="hud-stamp-btn pass" id="hudStampPass" title="Mark Specification Match (✓)">✓</button>
        <button class="hud-stamp-btn fail" id="hudStampFail" title="Mark Specification Violation (✗)">✗</button>
        <button class="hud-stamp-btn query" id="hudStampQuery" title="Mark Uncertain / Needs Review (?)">?</button>
      </div>

      <button class="btn btn-sm btn-primary-glass" id="hudOpenLabBtn">
        Open Step 5 Lab ↗
      </button>
    </div>

    <!-- Robot POV Modal Overlay -->
    <div id="robotPovModal"></div>
  </div>

  <!-- 2. Floating Top Navigation Header -->
  <header class="app-header floating-header">
    <!-- Step Navigation Tracker Pills (Click to open that step in modal) -->
    <span id="stageProgress" class="stage-progress">Stage 1 of 2 · Vacuum the floor</span>
    <nav class="steps-nav-tracker" id="topStepsNav">
      <button class="step-nav-item active" data-step="1">
        <span class="step-icon">🎯</span> 1. Purpose (P)
      </button>
      <button class="step-nav-item" data-step="2">
        <span class="step-icon">📡</span> 2. Sensors (E+S)
      </button>
      <button class="step-nav-item" data-step="3">
        <span class="step-icon">🦾</span> 3. Actuators (A)
      </button>
      <button class="step-nav-item" data-step="4">
        <span class="step-icon">🧩</span> 4. Decision Logic
      </button>
      <button class="step-nav-item" data-step="5">
        <span class="step-icon">🔬</span> 5. Test & Debug
      </button>
    </nav>

    <!-- Header Action Controls -->
    <div class="header-actions">
      <!-- 360° View Mode Dropdown / Button Group -->
      <div class="view-mode-group">
        <button class="btn-mode" id="viewMode3DBtn" title="Interactive 3D 360° Orbit (Apartment.glb)">
          🌐 3D 360°
        </button>
        <button class="btn-mode" id="viewModeFpsBtn" title="First-Person 360° Walkthrough">
          🚶 FPS 360°
        </button>

      </div>

      <!-- Robot POV Quick Button -->
      <button class="btn btn-sm btn-outline" id="quickPovBtn" title="Enter or exit the robot's first-person camera">
        👁️ POV
      </button>

      <!-- Audio Mute Toggle -->
      <button class="btn btn-sm btn-ghost" id="muteToggleBtn" title="Toggle sound effects">
        🔊 On
      </button>

      <!-- Open Workstation Button -->
      <button class="btn btn-sm btn-primary open-workstation-btn" id="openWorkstationBtn">
        📋 Workstation
      </button>
    </div>
  </header>

  <!-- 3. Step Selection & Workstation Popup Modal Dialog -->
  <div id="stepModalOverlay" class="step-modal-overlay" style="display: none;">
    <div class="step-modal-dialog">
      <!-- Modal Header with Quick Step Tabs and Close Button -->
      <div class="step-modal-header">
        <div class="modal-header-meta">
          <span class="modal-badge-step" id="modalStepBadge">STEP 1 OF 5</span>
          <h2 id="modalStepHeading">Purpose & Performance Measures (P)</h2>
        </div>

        <!-- Step Tabs within the Modal -->
        <div class="modal-step-tabs" id="modalStepTabs">
          <button class="modal-tab-btn active" data-step="1">1. Purpose</button>
          <button class="modal-tab-btn" data-step="2">2. Sensors</button>
          <button class="modal-tab-btn" data-step="3">3. Actuators</button>
          <button class="modal-tab-btn" data-step="4">4. Logic</button>
          <button class="modal-tab-btn" data-step="5">5. Test & Debug</button>
        </div>

        <button class="modal-close-btn" id="stepModalCloseBtn" title="Close to Fullscreen Map (Esc)">
          ✕ Close [Esc]
        </button>
      </div>

      <!-- Modal Body Content -->
      <div class="step-modal-body">
        <div id="stepsPanelMount"></div>
        <div id="blockCanvasMount" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- Main JavaScript Module Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
